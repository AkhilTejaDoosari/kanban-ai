name: CI

# Generic scaffold. Project Intake replaces the setup step for the detected stack
# and enables push/PR triggers after the project is CONFIGURED.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unconfigured template guard
        run: |
          echo "This workflow is a scaffold. Project Intake must configure stack setup and normal triggers before CI is considered active."

      - name: Validate
        run: bash scripts/validate.sh
